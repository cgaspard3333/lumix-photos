name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Sans les secrets (fork, pull request), l'APK est signé avec une clé de debug
      HAS_KEY: ${{ secrets.LUMIX_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.LUMIX_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lumix-release.jks"
          echo "ORG_GRADLE_PROJECT_LUMIX_KEYSTORE=$RUNNER_TEMP/lumix-release.jks" >> "$GITHUB_ENV"

      - name: Tests et APK
        env:
          ORG_GRADLE_PROJECT_LUMIX_KEYSTORE_PASSWORD: ${{ secrets.LUMIX_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_LUMIX_KEY_ALIAS: lumix
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk LumixPhotos-${GITHUB_REF_NAME//\//-}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LumixPhotos
          path: LumixPhotos-*.apk

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" LumixPhotos-*.apk --title "Lumix Photos $GITHUB_REF_NAME" --generate-notes
